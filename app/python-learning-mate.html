<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파이썬 러닝메이트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== 1. 말랑말랑 파스텔 테마 (CSS = 집의 인테리어) ===== */
:root{
  color-scheme:light;
  --ink:#4a4060; --sub:#8a7fa3; --line:#ffe0ee;
  --pink:#ff7fb0; --pink-d:#e2609a; --pink-soft:#fff0f6;
  --main:#ff7fb0; --main-soft:#fff0f6;
  --lav:#b9a4ff; --sky:#8fd3ff; --mint:#9fe3b8; --butter:#ffd76e;
  --solo:#3dbb7e; --solo-soft:#e5f8ee;
  --hint:#f59e0b; --hint-soft:#fff6e0;
  --fail:#ff6b81; --fail-soft:#ffeef1;
  --due:#ff8a3d; --radius:22px;
  --card:rgba(255,255,255,.92);
}
*{box-sizing:border-box}
select,option,input,textarea,button{color:var(--ink)}
select,option{background:#fff}
html{min-height:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,#a9dcff 0%,#cdeaff 40%,#fde6f1 100%) fixed}
button{font:inherit;cursor:pointer}
textarea{font:inherit}
pre,code,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.cute,h2,h3,.logo,.big,.stat .n,.t{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}

/* ===== 2. 배경 꾸미기: 구름 · 언덕 · 떠오르는 하트 ===== */
#deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;filter:drop-shadow(0 6px 10px rgba(120,170,220,.25));animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:12%;bottom:20%}
.cloud::after{width:40%;height:120%;right:12%;bottom:25%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.hill{position:absolute;border-radius:50%}
.h1{width:80vw;height:40vh;left:-15vw;bottom:-28vh;background:#c9f0d4}
.h2{width:90vw;height:46vh;right:-25vw;bottom:-34vh;background:#b5e8c6}
.h3{width:70vw;height:30vh;left:25vw;bottom:-24vh;background:#d8f6e0}
.float{position:absolute;bottom:-40px;animation:rise linear infinite;opacity:.7}
@keyframes rise{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.7}50%{transform:translate(20px,-55vh) rotate(20deg)}100%{transform:translate(-10px,-115vh) rotate(-15deg);opacity:0}}
.twinkle{position:absolute;color:#fff;animation:tw 2.4s ease-in-out infinite;text-shadow:0 0 8px #fff}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.cloud,.float,.twinkle{animation:none}.float{display:none}}

/* ===== 3. 상단 메뉴 ===== */
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border-bottom:3px solid #ffd3e6}
.head-in{max-width:880px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:24px;color:var(--pink);white-space:nowrap;text-shadow:2px 2px 0 #fff,-1px -1px 0 #fff}
.logo span{color:#8b7cf6}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:flex-end}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:transparent;padding:7px 13px;border-radius:999px;color:var(--sub);font-family:'Jua',sans-serif;font-size:16px;white-space:nowrap;transition:.15s}
nav button:hover{background:#fff5fa}
nav button.on{background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--pink-d)}
@media (max-width:560px){nav{justify-content:flex-start;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.logo{font-size:20px}.hero::after{display:none}.hero .big{font-size:24px}}

main{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:20px 16px 150px}
h2{font-size:24px;margin:10px 0 12px;color:#6b5a8a;text-shadow:2px 2px 0 rgba(255,255,255,.9)}
h3{font-size:19px;margin:0 0 10px;color:var(--pink)}
.muted{color:var(--sub);font-size:14px}
.card{background:var(--card);border:3px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 5px 0 #ffd3e6,0 10px 22px rgba(255,140,190,.12)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

/* 말랑 버튼: 누르면 쏙 들어가요 */
.btn{border:2px solid #ffd3e6;background:#fff;padding:9px 16px;border-radius:16px;font-weight:700;box-shadow:0 4px 0 #ffd3e6;transition:transform .08s,box-shadow .08s}
.btn:hover{background:#fff8fb}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #ffd3e6}
.btn.primary{background:linear-gradient(180deg,#ff9cc7,#ff7fb0);border-color:var(--pink-d);color:#fff;box-shadow:0 4px 0 var(--pink-d)}
.btn.primary:active{box-shadow:0 1px 0 var(--pink-d)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chip{border:2px solid #ffe0ee;background:#fff;border-radius:999px;padding:5px 13px;font-size:13px;color:var(--sub);transition:.12s}
.chip:hover{border-color:#ffc0dc;transform:translateY(-1px)}
.chip.on{background:#8b7cf6;border-color:#8b7cf6;color:#fff;font-weight:700;box-shadow:0 3px 0 #6d5fd6}
.filter-label{font-size:13px;color:var(--pink);font-family:'Jua',sans-serif;margin:4px 0 6px}

/* 배지 */
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;font-weight:700;white-space:nowrap}
.b-new{background:#f3f0fa;color:#8a7fa3}
.b-due{background:#ffeede;color:var(--due)}
.b-learning{background:#eef4ff;color:#5b8def}
.b-done{background:var(--solo-soft);color:var(--solo)}
.b-concept{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.12)}
.lv{font-size:12px;color:var(--sub)}

/* 문제 카드 */
.pcard{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.pcard:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:0 8px 0 #ffd3e6,0 14px 26px rgba(255,140,190,.18)}
.pcard:active{transform:translateY(2px);box-shadow:0 2px 0 #ffd3e6}
.pcard .t{font-size:18px}
.pcard .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}

/* 히어로 */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#ffb3d1 0%,#c9b6ff 60%,#9fd8ff 100%);color:#fff;border-color:#fff;box-shadow:0 6px 0 #e9b8f0,0 14px 30px rgba(185,164,255,.35)}
.hero .big{font-size:28px;margin:2px 0;text-shadow:2px 2px 0 rgba(226,96,154,.35)}
.hero .muted{color:rgba(255,255,255,.95)}
.hero::after{content:'✦ ♡ ✦';position:absolute;right:16px;top:10px;font-size:18px;letter-spacing:6px;opacity:.8}

/* 상세 화면 */
.example{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.example{grid-template-columns:1fr}}
.ex-box{background:#fffafc;border:2px dashed #ffd3e6;border-radius:16px;padding:10px 12px}
.ex-box b{font-size:12px;color:var(--pink)}
.ex-box pre{margin:4px 0 0;white-space:pre-wrap;font-size:14px}
textarea.code{width:100%;min-height:160px;border:2px solid #e6defa;border-radius:16px;padding:12px;font-family:'JetBrains Mono',monospace;font-size:14px;background:#fdfcff;resize:vertical;tab-size:4}
textarea.code:focus,textarea.memo:focus,.stdin:focus,select:focus,input.txt:focus{outline:none;border-color:#b9a4ff;box-shadow:0 0 0 4px rgba(185,164,255,.2)}
textarea.memo{width:100%;min-height:70px;border:2px solid #ffe0ee;border-radius:16px;padding:10px 12px;resize:vertical;background:#fff}
.hint{border:2px solid #ffe2a8;background:var(--hint-soft);padding:10px 14px;border-radius:16px;margin:8px 0;white-space:pre-wrap}
.hint b{color:#d98200}
.hint pre{background:#fff;border-radius:12px;padding:10px;margin:6px 0 0;overflow-x:auto;font-size:13.5px}
.answer{border:2px solid #b8ecd0;background:var(--solo-soft);padding:10px 14px;border-radius:16px;margin-top:8px}
.answer pre{background:#fff;border-radius:12px;padding:10px;margin:6px 0;overflow-x:auto;font-size:13.5px}
.result-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
@media (max-width:560px){.result-btns{grid-template-columns:1fr}}
.rbtn{border:2px solid #ffe0ee;background:#fff;border-radius:16px;padding:12px 8px;font-weight:700;box-shadow:0 4px 0 #ffe0ee;transition:transform .08s}
.rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #ffe0ee}
.rbtn.on.solo{border-color:var(--solo);background:var(--solo-soft);color:var(--solo);box-shadow:0 4px 0 #9fdcbc}
.rbtn.on.hint{border-color:var(--hint);background:var(--hint-soft);color:#c57a00;box-shadow:0 4px 0 #ffd27a}
.rbtn.on.fail{border-color:var(--fail);background:var(--fail-soft);color:var(--fail);box-shadow:0 4px 0 #ffb3bf}
.attempt{border-top:2px dashed #ffe0ee;padding:10px 0}
.attempt:first-child{border-top:0}
details summary{cursor:pointer;color:#8b7cf6;font-size:13px}
details pre{background:#faf8ff;border-radius:12px;padding:10px;overflow-x:auto;font-size:13px}

/* 성장 화면 */
.stat{text-align:center}
.stat .n{font-size:30px;color:var(--pink)}
.stat .l{font-size:13px;color:var(--sub)}
.bar-row{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;margin:9px 0;font-size:14px}
.bar-bg{background:#f6f0fb;border-radius:999px;height:14px;overflow:hidden;border:2px solid #f0e8fa}
.bar-fg{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.3,1.6,.5,1)}
.chart{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.stack{width:100%;max-width:26px;display:flex;flex-direction:column-reverse;border-radius:10px 10px 4px 4px;overflow:hidden}
.col small{font-size:10px;color:var(--sub);margin-top:4px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-top:8px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.empty{text-align:center;color:var(--sub);padding:26px 10px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:var(--pink-d);border:3px solid #ffd3e6;box-shadow:0 5px 0 #ffc0dc;padding:10px 20px;border-radius:999px;font-family:'Jua',sans-serif;font-size:16px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warn{background:#fff7e6;border:2px solid #f5d59a;color:#8a5a00;border-radius:16px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.steps{margin:0;padding-left:20px}
.steps li{margin:5px 0}

/* AI 문제 · 코드 실행 */
.b-ai{background:#efe9ff;color:#7c5cf0}
.runbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.stdin{width:100%;min-height:54px;border:2px solid #e6defa;border-radius:14px;padding:8px 10px;font-family:'JetBrains Mono',monospace;font-size:13px;resize:vertical;background:#fdfcff}
.console{background:#2d2640;color:#f3eefe;border-radius:16px;padding:12px 14px;margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:13px;white-space:pre-wrap;word-break:break-all;min-height:44px;border:3px solid #e6defa}
.console .e{color:#ffa3b5}
.console .k{color:#ffd76e}
.verdict{margin-top:10px;padding:10px 14px;border-radius:16px;font-family:'Jua',sans-serif;font-size:17px}
.verdict.ok{background:var(--solo-soft);color:var(--solo);border:2px solid #b8ecd0;animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.verdict.no{background:var(--fail-soft);color:var(--fail);border:2px solid #ffc6d0}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
.field{display:block;font-size:14px;font-family:'Jua',sans-serif;color:var(--pink);margin:12px 0 6px}
select,input.txt{font:inherit;border:2px solid #ffe0ee;border-radius:14px;padding:9px 12px;background:#fff;width:100%}
.ai-note{background:#f6f1ff;border:2px solid #e3d5ff;color:#6a4fc4;border-radius:16px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.spinner{display:inline-block;width:14px;height:14px;border:3px solid #ffd3e6;border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 대시보드 ===== */
.today-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:12px;margin-bottom:5px;background:#fffafc;border:2px solid #ffe8f2}
.todo li.ok{background:var(--solo-soft);border-color:#c6efd9;color:#2e8f60;text-decoration:line-through;text-decoration-color:rgba(46,143,96,.4)}
.goal-row{margin-top:12px;padding-top:10px;border-top:2px dashed #ffe0ee;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;background:#faf7fd;border:2px solid #f0e8fa;font-size:13px;color:var(--sub)}
.wd b{font-family:'Jua',sans-serif;font-size:18px;height:22px}
.wd.on{background:linear-gradient(180deg,#ffd1e5,#ffb3d1);border-color:#ff9cc7;color:#fff}
.wd.today{outline:3px solid #b9a4ff;outline-offset:1px}
.wd.future{opacity:.5}
.report{background:linear-gradient(135deg,#fff5fa,#f4efff)}
.heat-wrap{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.heat-days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:10px;color:var(--sub)}
.heat-days span{height:15px;line-height:15px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,15px);grid-auto-columns:15px;gap:3px}
.hc{display:inline-block;width:15px;height:15px;border-radius:4px;vertical-align:-3px}
.hc.l0{background:#f1edf6}.hc.l1{background:#c9f0d4}.hc.l2{background:#8fdcaa}.hc.l3{background:#4cc38a}.hc.l4{background:#2e9e68}
.hc.fut{background:transparent}
.legend .hc{margin:0 1px}
.bar-row.mini{grid-template-columns:62px 1fr 28px;margin:5px 0;font-size:13px}
.overdue{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:12px;background:#fff4ec;border:2px solid #ffe0c8;margin-top:5px;cursor:pointer;font-size:14px}
.overdue b{color:var(--due);white-space:nowrap}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ach{text-align:center;padding:12px 8px;border-radius:16px;background:#f7f5fa;border:2px solid #eee8f5;color:#b3aac4;font-size:12px;display:flex;flex-direction:column;gap:2px}
.ach .ai{font-size:30px;filter:grayscale(1);opacity:.6}
.ach b{font-family:'Jua',sans-serif;font-weight:400;font-size:15px}
.ach.on{background:linear-gradient(180deg,#fffbe8,#fff0f6);border-color:#ffd76e;color:#6b5a8a;box-shadow:0 4px 0 #ffe6a3}
.ach.on .ai{filter:none;opacity:1;animation:pop .5s cubic-bezier(.3,1.8,.5,1)}

/* ===== 친구 ===== */
.av{border-radius:50%;object-fit:cover;background:#f3eefa;border:3px solid #fff;box-shadow:0 2px 0 #ffd3e6;flex:none}
.live{color:#22b573;font-weight:700}
.toggle{border:2px solid #e6defa;background:#f3f0fa;color:var(--sub);border-radius:999px;padding:7px 16px;font-family:'Jua',sans-serif;font-size:15px}
.toggle.on{background:var(--solo);border-color:var(--solo);color:#fff;box-shadow:0 3px 0 #2a9c66}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:16px}
.fgrid .card{margin-bottom:0}
.fcard{display:flex;flex-direction:column;gap:10px}
.fhead{display:flex;gap:10px;align-items:center}
.fstats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
.fstats b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:19px;color:var(--pink)}
.fstats span{font-size:11px;color:var(--sub)}
.spark{display:flex;align-items:flex-end;gap:4px;height:42px;justify-content:center}
.spark i{width:16px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#9fe3b8,#4cc38a)}
.cheer-row,.react-bar{display:flex;gap:6px;justify-content:center}
.cheer{border:2px solid #ffe0ee;background:#fff;border-radius:999px;font-size:20px;width:44px;height:40px;box-shadow:0 3px 0 #ffe0ee;transition:transform .1s}
.cheer:hover{transform:translateY(-2px) scale(1.08)}
.cheer:active{transform:translateY(2px);box-shadow:0 1px 0 #ffe0ee}
.cheer-in{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:2px dashed #ffe8f2}
.cheer-in:first-of-type{border-top:0}
.cheer-in span:nth-child(2){flex:1}
.rank{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;margin-top:6px;background:#fffafc;border:2px solid #ffeef6}
.rank.me{background:#f6f1ff;border-color:#e3d5ff}
.medal{width:26px;text-align:center;font-family:'Jua',sans-serif;font-size:18px}

/* ===== 함께 공부방 ===== */
.meet-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.meet-grid{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:18px;background:linear-gradient(180deg,#f0fff6,#fff);border:3px solid #c6efd9;text-align:center;min-height:170px}
.tile.brk{background:linear-gradient(180deg,#fff6ec,#fff);border-color:#ffe0c8}
.tile.me{outline:3px solid #b9a4ff;outline-offset:2px}
.tile .note{font-size:13px;color:#6b5a8a}
.floatemo{position:absolute;bottom:40px;font-size:34px;animation:floatup 2.2s ease-out forwards;pointer-events:none}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-20px) scale(1.2)}100%{transform:translateY(-240px) scale(1);opacity:0}}
.chat{height:260px;overflow-y:auto;background:#fdfbff;border:2px solid #efe8fa;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.msg.mine{align-items:flex-end}
.msg .who{font-size:11px;color:var(--sub)}
.msg .bub{background:#fff;border:2px solid #ffe0ee;border-radius:14px 14px 14px 4px;padding:6px 11px;max-width:85%;word-break:break-word}
.msg.mine .bub{background:#ffe8f2;border-color:#ffc0dc;border-radius:14px 14px 4px 14px}

/* ===== 말랑이 회의실 (Zoom 스타일) ===== */
.zoom{background:#2b2540;border-radius:24px;padding:12px;box-shadow:0 6px 0 #1d1830,0 14px 30px rgba(60,40,100,.3);position:relative}
.zstage{position:relative;min-height:300px;overflow:hidden;border-radius:16px}
.zgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.zgrid.n1{grid-template-columns:1fr}
.ztile{--mc:#9fe3b8;position:relative;aspect-ratio:16/11;border-radius:16px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--mc) 22%,#4a4166),#3a3352);display:flex;align-items:center;justify-content:center;cursor:pointer;border:3px solid transparent;overflow:hidden;transition:border-color .2s}

.zhand{position:absolute;right:8px;top:6px;font-size:24px;animation:wave 1s ease-in-out infinite;transform-origin:70% 90%}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
.zsay{position:absolute;top:10%;left:50%;transform:translateX(-50%);background:#fff;color:#4a4060;border-radius:14px;padding:4px 10px;font-size:13px;max-width:85%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 0 rgba(0,0,0,.15);z-index:2;animation:pop .3s cubic-bezier(.3,1.8,.5,1)}
.znote{position:absolute;bottom:34px;left:0;right:0;text-align:center;color:#f3eefe;font-size:12px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlg .mbody{fill:color-mix(in srgb,var(--mc,#9fe3b8) 45%,white)}

.zpick button small{font-size:10px;color:#c9c0e0}
.zpick button.on,.zpick button:hover{border-color:#ff9cc7;background:#4a3f6b}
.cam-card{background:linear-gradient(135deg,#fff5fa,#eef7ff)}
@media (max-width:560px){.zgrid{grid-template-columns:1fr 1fr}.zbtn{min-width:52px;padding:5px 6px}.zbtn small{font-size:10px}.ztile .mlg{width:72%}}

/* ===== 말랑이 힐링 탭 ===== */
.heal-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}

.timer{text-align:center;font-family:'Jua',sans-serif;font-size:46px;color:var(--pink);text-shadow:3px 3px 0 #fff;margin:0 0 6px}
body.healing #bubble{display:none}

/* ===== 4. 3D 마스코트 말랑이 (오른쪽 아래에 항상 있어요) ===== */
#mascot{position:fixed;right:14px;bottom:10px;width:150px;height:150px;z-index:20;cursor:pointer;touch-action:manipulation}

#bubble.show{opacity:1;transform:none}
@media (max-width:560px){#mascot{width:104px;height:104px;right:6px;bottom:4px}#bubble{right:98px;bottom:62px;max-width:190px;font-size:14px}}

const KEY = 'pymate-v1';
let storageOk = true;
let db = load();
refreshProblems();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d = JSON.parse(raw); d.records ||= {}; d.drafts ||= {}; d.generated ||= []; return d; }
  }catch(e){ storageOk = false; }
  return { records:{}, drafts:{}, generated:[] };
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); storageOk = true; }
  catch(e){ storageOk = false; }
}

/* ---------- 4. 날짜 도우미 ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd();
function addDays(str, n){ const d = new Date(str+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); }
function prettyDate(str){ const [y,m,d] = str.split('-'); return `${+m}/${+d}`; }

/* ---------- 5. 복습 규칙 (간격 반복) ----------
   혼자 풀면 복습 간격이 3 → 7 → 14 → 30 → 60일로 점점 길어지고,
   힌트를 쓰면 2일 뒤, 못 풀면 다음 날 다시 복습해요. */
const GAPS = [0, 3, 7, 14, 30, 60];
function saveAttempt(pid, result, hints, code, memo, passed, sec){
  const r = db.records[pid] || { attempts:[], box:0 };
  r.attempts.push({ date:today(), ts:Date.now(), result, hints, code, memo, passed:!!passed, sec:sec || 0 });
  if(result === 'solo'){ r.box = Math.min((r.box||0)+1, 5); r.next = addDays(today(), GAPS[r.box]); }
  else if(result === 'hint'){ r.box = 0; r.next = addDays(today(), 2); }
  else { r.box = 0; r.next = addDays(today(), 1); }
  db.records[pid] = r;
  delete db.drafts[pid];
  save();
}
function lastAttempt(pid){ const r = db.records[pid]; return r && r.attempts.length ? r.attempts[r.attempts.length-1] : null; }
function statusOf(pid){
  const r = db.records[pid], last = lastAttempt(pid);
  if(!last) return 'new';
  if(r.next && r.next <= today()) return 'due';
  return last.result === 'solo' ? 'done' : 'learning';
}
const STATUS = { new:['안 푼 문제','b-new'], due:['복습할 때!','b-due'], learning:['연습 중','b-learning'], done:['완료','b-done'] };

/* ---------- 6. 통계 계산 ---------- */
function allAttempts(){
  const list = [];
  for(const [pid, r] of Object.entries(db.records)) for(const a of r.attempts) list.push({ ...a, pid });
  return list.sort((a,b) => a.ts - b.ts);
}
function streak(){
  const days = new Set(allAttempts().map(a => a.date));
  let d = today(), n = 0;
  if(!days.has(d)) d = addDays(d, -1);           // 오늘 아직 안 했으면 어제부터 셈
  while(days.has(d)){ n++; d = addDays(d, -1); }
  return n;
}
function mastery(c){
  const ps = PROBLEMS.filter(p => p.c === c && (!p.ai || lastAttempt(p.id)));
  let s = 0;
  for(const p of ps){ const l = lastAttempt(p.id); if(l) s += l.result==='solo' ? 1 : l.result==='hint' ? .5 : 0; }
  return Math.round(s / ps.length * 100);
}
function dueList(){ return PROBLEMS.filter(p => statusOf(p.id) === 'due'); }

const statusBadge = pid => { const [t,cls] = STATUS[statusOf(pid)]; return `<span class="badge ${cls}">${t}</span>`; };

/* 대시보드: 공부 습관 기르기 */
const DOW = ['월','화','수','목','금','토','일'];             // 월요일부터
function goals(){ db.goals ||= { daily:2, weekDays:5 }; return db.goals; }
const dowIdx = str => (new Date(str + 'T00:00:00').getDay() + 6) % 7;   // 월=0 … 일=6
const weekStart = str => addDays(str, -dowIdx(str));
function fmtTime(sec){
  const m = Math.round((sec || 0) / 60);
  if(m < 60) return `${m}분`;
  return `${Math.floor(m / 60)}시간 ${m % 60 ? (m % 60) + '분' : ''}`.trim();
}
function maxStreak(at){
  const ds = [...new Set(at.map(a => a.date))].sort();
  let best = 0, cur = 0, prev = null;
  for(const d of ds){ cur = prev && addDays(prev, 1) === d ? cur + 1 : 1; best = Math.max(best, cur); prev = d; }
  return best;
}
// 복습을 제때 했는지: 복습 규칙을 처음부터 다시 따라가며 계산
function reviewStats(){
  let onTime = 0, late = 0;
  for(const r of Object.values(db.records)){
    let box = 0, due = null;
    for(const a of r.attempts){
      if(due){ if(a.date <= addDays(due, 1)) onTime++; else late++; }   // 예정일 다음 날까지는 '제때'
      if(a.result === 'solo'){ box = Math.min(box + 1, 5); due = addDays(a.date, GAPS[box]); }
      else if(a.result === 'hint'){ box = 0; due = addDays(a.date, 2); }
      else { box = 0; due = addDays(a.date, 1); }
    }
  }
  const overdue = PROBLEMS.filter(p => { const r = db.records[p.id]; return r && r.next && r.next < today(); })
    .map(p => ({ p, days: Math.round((new Date(today()) - new Date(db.records[p.id].next)) / 864e5) }))
    .sort((a, b) => b.days - a.days);
  return { onTime, late, rate: onTime + late ? Math.round(onTime / (onTime + late) * 100) : null, overdue };
}
function soloStreakBest(at){ let best = 0, cur = 0; for(const a of at){ cur = a.result === 'solo' && !a.hints ? cur + 1 : 0; best = Math.max(best, cur); } return best; }

function ringSVG(val, max, color){
  const r = 42, c = 2 * Math.PI * r, p = Math.min(val / Math.max(max, 1), 1);
  return `<svg viewBox="0 0 100 100" width="118" height="118" role="img" aria-label="오늘 ${val}/${max}">

    <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" transform="rotate(-90 50 50)" style="transition:stroke-dashoffset .8s cubic-bezier(.3,1.4,.5,1)"/>
    <text x="50" y="47" text-anchor="middle" font-family="Jua" font-size="24" fill="#4a4060">${val}/${max}</text>

function renderGrowth(){
  const at = allAttempts(), g = goals(), t = today();
  const countOn = d => at.filter(a => a.date === d).length;
  const todayN = countOn(t);
  const ws = weekStart(t);
  const thisWeek = at.filter(a => a.date >= ws);
  const lastWeek = at.filter(a => a.date >= addDays(ws, -7) && a.date < ws);
  const weekDaysDone = new Set(thisWeek.map(a => a.date)).size;
  const totalSec = at.reduce((s, a) => s + (a.sec || 0), 0);
  const weekSec = thisWeek.reduce((s, a) => s + (a.sec || 0), 0);
  const rv = reviewStats();
  const due = dueList();
  const recent = at.slice(-10);
  const soloRate = recent.length ? Math.round(recent.filter(a => a.result === 'solo').length / recent.length * 100) : 0;
  const best = maxStreak(at), cur = streak();
  const stats = {
    total: at.length, best, rv, sec: totalSec, soloRun: soloStreakBest(at),
    conceptsTried: new Set(at.map(a => byId[a.pid]?.c).filter(Boolean)).size,
    mastered: Object.keys(CONCEPTS).filter(k => mastery(k) === 100).length,
    aiSolved: new Set(at.filter(a => byId[a.pid]?.ai && a.result !== 'fail').map(a => a.pid)).size,
  };
  const sel = (id, val, opts) => `<select id="${id}" style="width:auto;padding:5px 10px">${opts.map(v => `<option value="${v}" ${+val === v ? 'selected' : ''}>${v}</option>`).join('')}</select>`;

  // 오늘 할 일
  const soloToday = at.some(a => a.date === t && a.result === 'solo' && !a.hints);
  const todos = [
    [due.length === 0, due.length ? `밀린·오늘 복습 ${due.length}개 끝내기` : '오늘 복습 끝! 👍'],
    [todayN >= g.daily, `오늘 목표 ${g.daily}문제 풀기 (${Math.min(todayN, g.daily)}/${g.daily})`],
    [soloToday, '힌트 없이 1문제 풀기'],
  ];
  const doneCount = todos.filter(x => x[0]).length;

  // 이번 주 7일
  const weekDots = DOW.map((name, i) => {
    const d = addDays(ws, i), n = countOn(d), future = d > t;
    return `<div class="wd ${n ? 'on' : ''} ${d === t ? 'today' : ''} ${future ? 'future' : ''}"><span>${name}</span><b>${n ? '✓' : future ? '' : '·'}</b></div>`;
  }).join('');
  const diff = thisWeek.length - lastWeek.length;

  // 잔디 (16주)
  const start = addDays(ws, -15 * 7), cells = [];
  const lv = n => n === 0 ? 0 : n === 1 ? 1 : n === 2 ? 2 : n <= 4 ? 3 : 4;
  for(let w = 0; w < 16; w++) for(let i = 0; i < 7; i++){
    const d = addDays(start, w * 7 + i);
    cells.push(d > t ? `<i class="hc fut"></i>` : `<i class="hc l${lv(countOn(d))}" title="${prettyDate(d)}: ${countOn(d)}문제"></i>`);
  }

  // 최근 14일
  const days = [];
  for(let i = 13; i >= 0; i--){
    const d = addDays(t, -i), of = at.filter(a => a.date === d);
    days.push({ d, solo:of.filter(a => a.result === 'solo').length, hint:of.filter(a => a.result === 'hint').length, fail:of.filter(a => a.result === 'fail').length });
  }
  const max14 = Math.max(1, ...days.map(x => x.solo + x.hint + x.fail));
  const seg = (n, color) => n ? `<div style="height:${n / max14 * 110}px;background:${color}"></div>` : '';

  // 공부 패턴: 요일 · 시간대
  const byDow = Array(7).fill(0); at.forEach(a => byDow[dowIdx(a.date)]++);
  const SLOTS = [['🌅 아침', 5, 12], ['☀️ 오후', 12, 18], ['🌆 저녁', 18, 23], ['🌙 밤', 23, 29]];
  const bySlot = SLOTS.map(([n, s, e]) => at.filter(a => { const h = new Date(a.ts).getHours(); const hh = h < 5 ? h + 24 : h; return hh >= s && hh < e; }).length);
  const maxD = Math.max(1, ...byDow), maxS = Math.max(1, ...bySlot);
  const topDow = at.length ? DOW[byDow.indexOf(Math.max(...byDow))] : null;
  const topSlot = at.length ? SLOTS[bySlot.indexOf(Math.max(...bySlot))][0] : null;
  const avgSec = at.filter(a => a.sec).length ? at.reduce((s, a) => s + (a.sec || 0), 0) / at.filter(a => a.sec).length : 0;

  // 약점 개념
  const tried = Object.keys(CONCEPTS).filter(k => at.some(a => byId[a.pid]?.c === k));
  const weak = tried.length ? tried.reduce((w, k) => mastery(k) < mastery(w) ? k : w, tried[0]) : null;

function tickHeal(){

  if(el) el.textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;

    clearInterval(healTimer.id); healTimer.end = 0;
    db.heal.breaks++; save();
    toast('휴식 끝! 다시 공부하러 가 볼까요? 💪');

  }

function bindHeal(app){
  const apply = () => window.malang?.setParams(healSet);
  ['force', 'size', 'soft', 'zoom'].forEach(id => {
    const el = app.querySelector('#' + id);
    el.addEventListener('input', () => { healSet[id] = +el.value; app.querySelector('#v_' + id).textContent = el.value; apply(); });
  });
  app.querySelector('[data-sound]').onclick = () => { healSet.sound = !healSet.sound; apply(); render(); };
  app.querySelectorAll('[data-min]').forEach(b => b.onclick = () => { if(!healTimer.end){ healTimer.min = +b.dataset.min; render(); } });
  app.querySelector('[data-timer]').onclick = () => {
    if(healTimer.end){ clearInterval(healTimer.id); healTimer.end = 0; render(); return; }
    healTimer.end = Date.now() + healTimer.min * 60000;
    healTimer.id = setInterval(tickHeal, 1000);
    window.malang?.say(`${healTimer.min}분 동안 푹 쉬자~ 🍡`);
    render();
  };
  apply();
}

/* ---------- 10. 브라우저 안에서 파이썬 실행 (Pyodide) ----------
   Pyodide = 브라우저 안에 들어가는 작은 파이썬. 처음 한 번만 불러오면 계속 쓸 수 있어요. */
const PY_URL = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const RUNNER = String.raw`import sys, io, json, traceback
def py_run(__CODE, __STDIN):
    _buf = io.StringIO()
    _lines = __STDIN.split('\n') if __STDIN else []
    _pos = [0]
    def _input(prompt=''):
        if prompt:
            _buf.write(str(prompt))
        if _pos[0] >= len(_lines):
            raise EOFError('입력값이 부족해요. [입력값] 칸에 값을 더 넣어 주세요.')
        v = _lines[_pos[0]]
        _pos[0] += 1
        return v
    _steps = [0]
    def _tr(frame, event, arg):
        _steps[0] += 1
        if _steps[0] > 200000:
            raise TimeoutError('너무 오래 실행돼요. 무한 반복(while)이 아닌지 확인해 보세요.')
        return _tr
    _old = sys.stdout
    sys.stdout = _buf
    _err = ''
    try:
        _code = compile(__CODE, '<내 코드>', 'exec')
        sys.settrace(_tr)
        exec(_code, {'__name__': '__main__', 'input': _input})
    except BaseException as e:
        sys.settrace(None)
        if isinstance(e, SyntaxError):
            _err = ''.join(traceback.format_exception_only(type(e), e))
        else:
            _fr = [f for f in traceback.extract_tb(e.__traceback__) if f.filename == '<내 코드>']
            _err = ''.join(traceback.format_list(_fr)) + ''.join(traceback.format_exception_only(type(e), e))
    finally:
        sys.settrace(None)
        sys.stdout = _old
    return json.dumps({'ok': not _err, 'out': _buf.getvalue(), 'err': _err}, ensure_ascii=False)
`;
let pyPromise = null, pyRun = null;
function loadPy(){
  if(pyPromise) return pyPromise;
  pyPromise = new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = PY_URL + 'pyodide.js';
    sc.onload = async () => {
      try{ const py = await loadPyodide({ indexURL:PY_URL }); py.runPython(RUNNER); pyRun = py.globals.get('py_run'); resolve(); }
      catch(e){ reject(e); }
    };
    sc.onerror = () => reject(new Error('pyodide load failed'));
    document.head.appendChild(sc);
  }).catch(e => { pyPromise = null; throw e; });
  return pyPromise;
}
async function runPy(code, stdin){ await loadPy(); return JSON.parse(pyRun(code, stdin || '')); }

let aiSample = null, aiChecked = false;
let ai = { concept:'for', level:'1', count:'3', memo:'', busy:false, status:'', error:'', made:[], denied:false, ctl:null };

function aiPrompt(){
  const c = ai.concept, n = +ai.count;
  const allowed = CONCEPT_ORDER.slice(0, CONCEPT_ORDER.indexOf(c) + 1).map(k => CONCEPTS[k].name).join(', ');
  const existing = PROBLEMS.filter(p => p.c === c).map(p => p.title).slice(-40).join(', ');
  return `너는 대학교 1학년 '파이썬 입문' 수업의 연습 문제 출제자야. 수업 직후 복습용 연습 문제를 ${n}개 만들어 줘.

[조건]
- 중심 개념: ${CONCEPTS[c].name}
- 사용할 수 있는 개념: ${allowed} (이 범위 밖의 문법이나 라이브러리는 쓰지 말 것)
- 난이도: ${LEVELS[ai.level]} (쉬움 = 정답 5줄 안팎, 보통 = 10줄 안팎, 도전 = 15줄 안팎)
- 오늘 수업 메모: ${ai.memo.trim() || '없음'}
- 이미 있는 문제와 겹치지 말 것: ${existing || '없음'}
- 학생이 "어떤 순서로 풀지", "어떤 문법을 쓸지" 스스로 생각하는 연습이 되도록 대학생 일상(시간표, 학점, 아르바이트, 카페 주문, 동아리 등)의 구체적인 상황을 쓸 것
- 모든 글은 한국어로 쓸 것

[문제 하나의 형식]
{"title": "15자 이내 제목",
 "desc": "문제 설명. 입력 형식과 출력 형식을 분명하게",
 "exIn": "input()으로 받는 입력 예시. 여러 개면 \\n 으로 구분해 한 줄에 하나씩. 입력이 없으면 \"(없음)\"",
 "exOut": "정답 코드에 exIn을 넣어 실행했을 때 나오는 정확한 출력",
 "hints": ["풀이 순서를 '① ... → ② ... → ③ ...' 형식으로", "어떤 문법을 왜 쓰는지 설명 (정답 코드를 그대로 말하지 말 것)", "코드 뼈대: 정답 코드에서 핵심 부분 2~3곳을 ____ 로 비운 코드"],
 "answer": "파이썬 3 정답 코드 (import 금지, input()은 exIn 줄 수만큼만 호출, 결과는 print로 출력)",
 "point": "핵심 포인트 한 줄"}

JSON 배열만 답해: [{...}, {...}]`;
}
function aiErrMsg(e){
  const c = e && e.code;
  if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){ ai.denied = true; return 'AI 사용이 허용되지 않아서 이 화면에서는 문제를 만들 수 없어요.'; }
  if(c === 'cancelled') return '생성을 멈췄어요.';
  if(c === 'rate_limited') return '지금은 AI 사용량이 많아요. 잠시 후 다시 눌러 주세요.';
  if(c === 'session_expired') return '로그인이 만료됐어요. 다시 로그인한 뒤 시도해 주세요.';
  if(c === 'invalid_json') return 'AI의 답을 읽지 못했어요. 한 번 더 눌러 주세요. (개수를 줄이면 더 잘 돼요)';
  if(c === 'refused') return '이 요청으로는 문제를 만들 수 없어요. 수업 메모를 바꿔 보세요.';
  return '연결 문제로 실패했어요. 다시 눌러 주세요.';
}
const validItem = it => it && typeof it === 'object' && it.title && it.desc && it.answer && Array.isArray(it.hints) && it.hints.length >= 3;

async function generate(){
  if(ai.busy || !aiSample) return;
  Object.assign(ai, { busy:true, error:'', made:[], status:'🤖 AI가 문제를 만드는 중이에요... (보통 10~60초)' });
  render();
  loadPy().catch(() => {});                     // 기다리는 동안 파이썬도 미리 불러오기
  const ctl = ai.ctl = new AbortController();
  let items;
  try{ items = await aiSample.json(aiPrompt(), { signal:ctl.signal, cache:false }); }
  catch(e){ Object.assign(ai, { busy:false, status:'', error:aiErrMsg(e) }); render(); return; }
  if(!Array.isArray(items)) items = [items];

  ai.status = '🐍 앱이 정답 코드를 직접 실행해서 확인하는 중...'; render();
  let pyOk = true;
  try{ await loadPy(); }catch(e){ pyOk = false; }
  const made = []; let dropped = 0;
  for(const [i, it] of items.entries()){
    if(!validItem(it)){ dropped++; continue; }
    const prob = { id:'ai-' + Date.now().toString(36) + i, c:ai.concept, lv:+ai.level, ai:true, created:today(),
      title:String(it.title).slice(0,40), desc:String(it.desc), exIn:String(it.exIn || '(없음)'), exOut:String(it.exOut ?? ''),
      hints:it.hints.slice(0,3).map(String), answer:String(it.answer), point:String(it.point || ''), check:'unchecked' };
    if(pyOk){
      let r; try{ r = await runPy(prob.answer, stdinOf(prob)); }catch(e){ r = null; }
      if(!r || !r.ok || !norm(r.out)){ dropped++; continue; }   // 정답 코드가 에러 → 버리기
      if(sameOut(r.out, prob.exOut)) prob.check = 'ok';
      else { prob.exOut = norm(r.out); prob.check = 'fixed'; }
    }
    made.push(prob);
  }
  db.generated.push(...made); save(); refreshProblems();
  Object.assign(ai, { busy:false, made:made.map(p => p.id),
    status: made.length ? `✅ ${made.length}문제를 만들었어요!${dropped ? ` (정답 코드에 오류가 있던 ${dropped}문제는 버렸어요)` : ''}` : '',
    error: made.length ? '' : '쓸 수 있는 문제가 나오지 않았어요. 다시 눌러 주세요.' });
  render();
  if(made.length) window.malang?.react('ai');
}

const S = { ready:false, db:null, user:null, room:null, me:null,

async function initSocial(){

  try{ [S.user, S.db, S.room] = await Promise.all([claude.use('user'), claude.use('db'), claude.use('room')]); }catch(e){}

    S.db.doc(`data/users/${S.me}/social`).onSnapshot(s => {

      S.shareOn = d.share !== false;
      socialChanged(); publishStatus();
    }, quiet);
    S.db.collection('status').limit(300).onSnapshot(q => {
      S.statuses = {}; q.docs.forEach(d => { S.statuses[d.id] = d.data() || {}; }); socialChanged();
    }, quiet);
    S.db.collection('cheers').limit(300).onSnapshot(q => {
      const list = [];
      q.docs.forEach(d => {
        const to = (d.data() || {}).to || {};
        if(d.id === S.me) S.myCheers = { ...to };
        const c = to[S.me];
        if(c && typeof c === 'object') list.push({ from:d.id, emoji:String(c.emoji || '👏').slice(0, 4), ts:+c.ts || 0, n:+c.n || 1 });
      });
      list.sort((a, b) => b.ts - a.ts);
      notifyCheers(list); S.cheersIn = list; socialChanged();
    }, quiet);
    S.db.doc('live/studyroom').onSnapshot(s => {
      const d = s.data() || {};
      S.timer = d.timer && typeof d.timer === 'object' ? d.timer : null;
      S.link = typeof d.link === 'string' ? d.link : '';
      socialChanged();
    }, quiet);
  }
  if(S.room){
    S.room.onPeers(ch => { S.peers = ch.peers; if(!socialRaf) lobbyOnly = true; socialChanged(); }, () => {});
    S.room.on('cheer', m => {               // 접속 중인 친구가 보낸 응원은 바로 알림

    }, () => {});
    updatePresence();
  }
  socialChanged();
}

/* ----- 내 공부현황 올리기 (요약 숫자만! 코드·메모·문제 내용은 올리지 않아요) ----- */
function myStatus(){
  const at = allAttempts(), t = today(), g = goals(), ws = weekStart(t);
  const week = at.filter(a => a.date >= ws), recent = at.slice(-10);
  const days = []; for(let i = 6; i >= 0; i--){ const d = addDays(t, -i); days.push(at.filter(a => a.date === d).length); }
  return { date:t, weekStart:ws, today:at.filter(a => a.date === t).length, daily:g.daily, weekGoal:g.weekDays,
    weekDays:new Set(week.map(a => a.date)).size, week:week.length, weekSec:week.reduce((s, a) => s + (a.sec || 0), 0),
    streak:streak(), best:maxStreak(at), total:at.length, days,
    solo:recent.length ? Math.round(recent.filter(a => a.result === 'solo').length / recent.length * 100) : 0 };
}
let statusBusy = false, statusLast = '';
async function publishStatus(){
  if(!S.db || !S.me || statusBusy) return;
  const ref = S.db.doc('status/' + S.me);
  statusBusy = true;
  try{
    if(!S.shareOn){ if(statusLast !== 'off'){ await ref.delete(); statusLast = 'off'; } }
    else{
      const st = myStatus(), key = JSON.stringify(st);
      if(key !== statusLast){ await ref.set({ ...st, updated:Date.now() }); statusLast = key; }
    }
  }catch(e){ S.err = '공부현황을 올리지 못했어요. 이 앱의 공유 권한이 "참여자" 이상인지 확인해 주세요.'; }

}

const cheerCool = {};

async function sendCheer(fid, emoji){
  if(!S.db || !S.me || cheerBusy) return;
  if(Date.now() - (cheerCool[fid] || 0) < 8000){ toast('응원은 잠시 뒤에 또 보낼 수 있어요'); return; }
  cheerCool[fid] = Date.now(); cheerBusy = true;
  const prev = S.myCheers[fid];
  const to = { ...S.myCheers, [fid]:{ emoji, ts:Date.now(), n:(prev?.n || 0) + 1 } };
  const keep = Object.entries(to).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0)).slice(0, 60);   // 최근 60명만 보관
  try{ await S.db.doc('cheers/' + S.me).set({ to:Object.fromEntries(keep) }); S.myCheers = Object.fromEntries(keep); toast(`${emoji} 응원을 보냈어요!`); }
  catch(e){ toast('응원을 보내지 못했어요'); }
  cheerBusy = false;
  S.room?.emit('cheer', { to:fid, emoji }).catch(() => {});
}
function notifyCheers(list){
  const seen = db.cheerSeen || 0;
  const fresh = list.filter(c => c.ts > seen);
  if(!fresh.length) return;
  db.cheerSeen = Math.max(...fresh.map(c => c.ts)); save();
  if(seen === 0) return;                         // 처음 열었을 때는 알림 없이 목록에만
  nameOf(fresh[0].from).then(n => { toast(`${n}님이 ${fresh[0].emoji} 응원을 보냈어요!`); window.malang?.react('cheer'); });
}

function bindFriends(app){
  fillNames(app);

  app.querySelectorAll('[data-friend]').forEach(b => b.onclick = async () => {
    const id = b.dataset.friend; if(!S.friends.includes(id)) S.friends = [...S.friends, id].slice(0, 100);
    render(); await saveSocial(); toast('친구를 추가했어요!');
  });
  app.querySelectorAll('[data-unfriend]').forEach(b => b.onclick = async () => {
    if(b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = '정말 삭제?'; setTimeout(() => { b.dataset.armed = ''; b.textContent = '✕'; }, 3000); return; }
    S.friends = S.friends.filter(x => x !== b.dataset.unfriend); render(); await saveSocial();
  });
  app.querySelectorAll('[data-cheer]').forEach(b => b.onclick = () => sendCheer(b.dataset.cheer, b.dataset.emoji));
  const fs = app.querySelector('#fsearch');
  if(fs && S.user){
    fs.addEventListener('input', async () => {
      const q = fs.value.trim();

        <div class="rank">${avatar(h.id, 34)}<span style="flex:1">${nameSpan(h.id)}${S.statuses[h.id] ? '' : ' <span class="muted">· 아직 앱 기록 없음</span>'}</span>
        ${S.friends.includes(h.id) ? '<span class="muted">친구</span>' : `<button class="btn small primary" data-friend="${esc(h.id)}">친구 추가</button>`}</div>`).join('') ||
        (q ? '<p class="muted">찾는 사람이 없어요. 앱이 공유된 사람만 찾을 수 있어요.</p>' : '');
        fillNames(box);

S.talk = {};
const FACES = { smile:['😊', '방긋'], laugh:['😆', '빵터짐'], wow:['😮', '놀람'], love:['🥰', '좋아'], sleepy:['😴', '졸림'] };

// 말랑이 그림 (SVG = 코드로 그리는 그림)
function malangSVG(face, talking){

    laugh:  `<path d="M39 62 Q45 54 51 62" class="eyeL" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M69 62 Q75 54 81 62" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`,
    sleepy: `<path d="M39 61 L51 61 M69 61 L81 61" stroke="${ink}" stroke-width="3" stroke-linecap="round"/><text x="92" y="34" font-size="13" fill="#8b7cf6" font-family="Jua">z</text><text x="100" y="24" font-size="10" fill="#8b7cf6" font-family="Jua">z</text>`,
    love:   `<text x="45" y="66" font-size="15" text-anchor="middle" fill="#ff5c93">♥</text><text x="75" y="66" font-size="15" text-anchor="middle" fill="#ff5c93">♥</text>`,
  }[face] || `<g class="eye"><ellipse cx="45" cy="60" rx="4.8" ry="${face === 'wow' ? 7 : 6}" fill="${ink}"/><circle cx="46.6" cy="57.4" r="1.6" fill="#fff"/></g>
              <g class="eye"><ellipse cx="75" cy="60" rx="4.8" ry="${face === 'wow' ? 7 : 6}" fill="${ink}"/><circle cx="76.6" cy="57.4" r="1.6" fill="#fff"/></g>`;
  const mouth = talking ? `<ellipse class="talkm" cx="60" cy="73" rx="5" ry="4" fill="${ink}"/>` : {
    wow:    `<ellipse cx="60" cy="74" rx="4" ry="5" fill="${ink}"/>`,
    laugh:  `<path d="M51 69 Q60 83 69 69 Z" fill="${ink}"/><ellipse cx="60" cy="76" rx="4" ry="2" fill="#ff8fab"/>`,
    sleepy: `<ellipse cx="60" cy="72" rx="3" ry="2" fill="${ink}"/>`,
  }[face] || `<path d="M53 70 Q60 77 67 70" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  return `<svg class="mlg ${talking ? 'talk' : ''}" viewBox="0 0 120 110" aria-hidden="true">
    <ellipse cx="60" cy="101" rx="34" ry="5" fill="rgba(60,30,90,.22)"/>
    <g class="mb">
      <rect x="58.5" y="14" width="3" height="11" rx="1.5" fill="#7fd49b"/>
      <ellipse cx="52" cy="15" rx="8" ry="4" fill="#7fd49b" transform="rotate(-25 52 15)"/>
      <ellipse cx="68" cy="15" rx="8" ry="4" fill="#7fd49b" transform="rotate(25 68 15)"/>

      <ellipse cx="40" cy="45" rx="12" ry="6" fill="#fff" opacity=".5" transform="rotate(-20 40 45)"/>
      <ellipse cx="31" cy="70" rx="7" ry="4" fill="#ffb3cf" opacity="${face === 'love' || face === 'laugh' ? 1 : .75}"/>
      <ellipse cx="89" cy="70" rx="7" ry="4" fill="#ffb3cf" opacity="${face === 'love' || face === 'laugh' ? 1 : .75}"/>
      ${eyes}${mouth}
    </g></svg>`;
}

function peerInfo(p){
  const pr = p.presence || {}, uid = p.by || (typeof pr.uid === 'string' ? pr.uid : null);
  const talk = uid && S.talk[uid] && Date.now() - S.talk[uid].ts < 5000 ? S.talk[uid] : null;
  return { p, pr, uid, talk, face:FACES[pr.face] ? pr.face : 'smile', brk:pr.state === 'break', hand:!!pr.hand };
}
function tileHTML(info, big){
  const { p, pr, uid, talk, face, brk, hand } = info;
  const delay = (uid ? [...uid].reduce((s, c) => s + c.charCodeAt(0), 0) % 40 : 0) / 10;
  return `<div class="ztile ${big ? 'big' : ''} ${talk ? 'speaking' : ''} ${brk ? 'brk' : ''}" data-pin="${esc(uid || '')}" style="--d:${delay}s" ${uid ? `data-ucolor="${esc(uid)}"` : ''}>
    <span class="zstate">${brk ? '☕ 휴식' : '🔥 집중'}</span>
    ${hand ? '<span class="zhand">✋</span>' : ''}
    ${talk ? `<div class="zsay">${esc(talk.text)}</div>` : ''}
    ${malangSVG(face, !!talk)}
    ${pr.note ? `<div class="znote">「${esc(String(pr.note).slice(0, 40))}」</div>` : ''}
    <span class="zname">${talk ? '💬' : '🔇'} ${uid ? nameSpan(uid, p.isMe) : '손님'}</span>
  </div>`;
}
function stageHTML(){
  const list = S.studyPeers.map(peerInfo).sort((a, b) => (b.p.isMe - a.p.isMe) || (b.hand - a.hand));
  if(!list.length) return '<p class="muted" style="color:#ddd">사람들을 불러오는 중...</p>';
  if(meetUI.layout === 'speaker' && list.length > 1){
    const talker = list.filter(i => i.talk).sort((a, b) => b.talk.ts - a.talk.ts)[0];
    const main = list.find(i => i.uid && i.uid === meetUI.pin) || talker || list.find(i => !i.p.isMe) || list[0];
    return `<div class="zspeaker">${tileHTML(main, true)}</div><div class="zstrip">${list.filter(i => i !== main).map(i => tileHTML(i)).join('')}</div>`;
  }
  return `<div class="zgrid n${Math.min(list.length, 9)}">${list.map(i => tileHTML(i)).join('')}</div>`;
}
function refreshStage(){
  const st = document.getElementById('zstage'); if(!st) return false;
  st.innerHTML = stageHTML(); fillNames(st); bindPins(st);
  const c = document.getElementById('zcount'); if(c) c.textContent = `${S.studyPeers.length}명 참여 중`;
  return true;
}
function bindPins(root){
  root.querySelectorAll('[data-pin]').forEach(t => t.onclick = () => {

    meetUI.pin = meetUI.pin === id ? null : id; meetUI.layout = meetUI.pin ? 'speaker' : meetUI.layout; render();
  });
}

async function joinStudy(){
  if(!S.room || S.study) return;
  try{
    S.study = await S.room.join('studyroom');
    myStudy.since = Date.now();
    S.study.onPeers(ch => { S.studyPeers = ch.peers; if(!refreshStage()) socialChanged(); }, () => {});
    S.study.on('chat', m => {
      const text = typeof m.data?.text === 'string' ? m.data.text.slice(0, 300) : '';
      if(!text) return;
      S.chat.push({ by:m.by, me:m.isMe, text, ts:Date.now() }); S.chat = S.chat.slice(-60);
      if(m.by) S.talk[m.by] = { ts:Date.now(), text:text.slice(0, 60) };
      appendChat(); refreshStage();
    }, () => {});
    S.study.on('react', m => { const e = String(m.data?.emoji || '').slice(0, 4); if(e) floatEmoji(e); }, () => {});
    await S.study.presence({ uid:S.me, ...myStudy });
    toast('회의실에 들어왔어요!'); window.malang?.say('같이 공부하니까 더 힘이 난다 🔥');
  }catch(e){ toast('회의실에 들어가지 못했어요. 잠시 후 다시 해 주세요'); S.study = null; }
  render();
}
async function leaveStudy(){ try{ await S.study?.leave(); }catch(e){} S.study = null; S.studyPeers = []; S.chat = []; S.talk = {}; meetUI.pick = null; render(); }
function setStudy(patch){ Object.assign(myStudy, patch); S.study?.presence({ uid:S.me, ...myStudy }).catch(() => {}); refreshStage(); }
async function setRoomDoc(patch){ if(!S.db) return; await S.db.doc('live/studyroom').set({ timer:S.timer, link:S.link, ...patch }); }
function timerLeft(){ return S.timer?.endsAt ? Math.max(0, Math.ceil((S.timer.endsAt - Date.now()) / 1000)) : 0; }
function appendChat(){ const box = document.getElementById('chatBox'); if(!box) return; box.innerHTML = chatHTML(); fillNames(box); box.scrollTop = box.scrollHeight; }
const chatHTML = () => S.chat.length ? S.chat.map(c => `<div class="msg ${c.me ? 'mine' : ''}"><span class="who">${nameSpan(c.by)}</span><span class="bub">${esc(c.text)}</span></div>`).join('')

function floatEmoji(e){
  const g = document.getElementById('zstage'); if(!g) return;

let meetTick = null, chatDraft = '';
function bindMeet(app){
  fillNames(app); bindPins(app); bindAvatar(app);
  const box = app.querySelector('#chatBox'); if(box) box.scrollTop = box.scrollHeight;
  app.querySelector('[data-join]')?.addEventListener('click', joinStudy);
  app.querySelectorAll('[data-face]').forEach(b => b.onclick = () => { myStudy.face = b.dataset.face; meetUI.pick = null; setStudy({}); render(); });
  app.querySelectorAll('[data-react]').forEach(b => b.onclick = () => { S.study?.emit('react', { emoji:b.dataset.react }).catch(() => toast('보내지 못했어요. 공유 권한이 "참여자" 이상이어야 해요')); });
  app.querySelectorAll('[data-zb]').forEach(b => b.onclick = () => {
    const k = b.dataset.zb;
    if(k === 'face' || k === 'react'){ meetUI.pick = meetUI.pick === k ? null : k; render(); }
    if(k === 'hand'){ setStudy({ hand:!myStudy.hand }); if(myStudy.hand) window.malang?.say('손 들었어! ✋'); render(); }
    if(k === 'state'){ setStudy({ state:myStudy.state === 'break' ? 'focus' : 'break' }); render(); }
    if(k === 'layout'){ meetUI.layout = meetUI.layout === 'gallery' ? 'speaker' : 'gallery'; if(meetUI.layout === 'gallery') meetUI.pin = null; render(); }
    if(k === 'cam'){ meetUI.camInfo = !meetUI.camInfo; render(); }
    if(k === 'leave') leaveStudy();
  });
  const noteIn = app.querySelector('#noteIn');
  app.querySelector('[data-note]')?.addEventListener('click', () => { setStudy({ note:noteIn.value.trim().slice(0, 40) }); toast('한마디를 올렸어요'); });
  const chatIn = app.querySelector('#chatIn');
  if(chatIn){ chatIn.value = chatDraft; chatIn.addEventListener('input', () => { chatDraft = chatIn.value; }); }
  const send = () => {
    const text = chatIn.value.trim().slice(0, 300); if(!text || !S.study) return;
    if(Date.now() - chatCool < 700) return; chatCool = Date.now();
    S.study.emit('chat', { text }).catch(() => toast('메시지를 보내지 못했어요. 공유 권한이 "참여자" 이상이어야 해요'));
    chatIn.value = ''; chatDraft = '';
  };
  app.querySelector('[data-send]')?.addEventListener('click', send);
  chatIn?.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); send(); } });
  app.querySelectorAll('[data-timer2]').forEach(b => b.onclick = async () => {
    if(timerBusy) return; timerBusy = true;
    const k = b.dataset.timer2;
    const timer = k === 'stop' ? null : { phase:k, endsAt:Date.now() + (k === 'focus' ? 25 : 5) * 60000 };
    try{ await setRoomDoc({ timer }); }catch(e){ toast('타이머를 바꾸지 못했어요'); }
    timerBusy = false;
  });
  const linkIn = app.querySelector('#linkIn');
  app.querySelector('[data-link]')?.addEventListener('click', async () => {
    const v = linkIn.value.trim();
    if(!/^https:\/\/[^\s"'<>]{4,300}$/.test(v)){ toast('https:// 로 시작하는 주소를 넣어 주세요'); return; }
    if(linkBusy) return; linkBusy = true;
    try{ await setRoomDoc({ link:v }); toast('링크를 저장했어요'); }catch(e){ toast('저장하지 못했어요'); }
    linkBusy = false;
  });
  app.querySelector('[data-unlink]')?.addEventListener('click', async () => { try{ await setRoomDoc({ link:'' }); }catch(e){} });
  clearInterval(meetTick);
  let talkKey = '';
  meetTick = setInterval(() => {
    if(view.name !== 'meet'){ clearInterval(meetTick); return; }
    const el = document.getElementById('meetTimer');
    if(el){
      const left = timerLeft();
      el.textContent = left ? `${Math.floor(left / 60)}:${pad(left % 60)}` : '--:--';
      if(S.timer && !left && !S.timer.doneShown){ S.timer = { ...S.timer, doneShown:true };
        toast(S.timer.phase === 'focus' ? '집중 시간 끝! 다 같이 5분 쉬어요 ☕' : '휴식 끝! 다시 집중해 볼까요 🔥'); window.malang?.react('rested'); }
    }
    // 말하기(입 움직임)가 끝난 사람이 있으면 화면 갱신
    const k = Object.entries(S.talk).filter(([, v]) => Date.now() - v.ts < 5000).map(([id]) => id).join(',');
    if(k !== talkKey){ talkKey = k; refreshStage(); }
  }, 1000);
}

/* ---------- 9. 버튼 연결 ---------- */
function bind(app){
  app.querySelectorAll('[data-open]').forEach(el => el.onclick = () => go('detail', { pid:el.dataset.open, hintsShown:0, startTs:Date.now() }));
  app.querySelectorAll('[data-go]').forEach(el => el.onclick = () => go(el.dataset.go));
  app.querySelectorAll('[data-concept]').forEach(el => el.onclick = () => { filters = { concept:el.dataset.concept, level:'all', status:'all' }; go('problems'); });
  app.querySelectorAll('[data-filter]').forEach(el => el.onclick = () => { filters[el.dataset.filter] = el.dataset.val; render(); });
  app.querySelectorAll('[data-rf]').forEach(el => el.onclick = () => { reviewFilter = el.dataset.rf; render(); });

  if(view.name === 'detail'){
    const code = app.querySelector('#code'), memo = app.querySelector('#memo');
    const stdinBox = app.querySelector('#stdin');
    const keep = () => { view.code = code.value; view.memo = memo.value; view.stdin = stdinBox.value; };
    const p = byId[view.pid];
    const runWith = async (grade) => {
      keep();
      if(!code.value.trim()){ toast('먼저 코드를 써 주세요'); return; }
      view.runStatus = '<span class="spinner"></span>' + (pyRun ? '실행 중...' : '파이썬 불러오는 중... (처음 한 번만 10초쯤 걸려요)');
      view.runHtml = ''; render();
      let r;
      try{ r = await runPy(code.value, grade ? stdinOf(p) : view.stdin); }
      catch(e){ view.runStatus = ''; view.runHtml = `<div class="verdict no">파이썬을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.</div>`; render(); return; }
      view.runStatus = '';
      let html = `<div class="console">${esc(r.out) || (r.ok ? '<span class="k">(출력 없음)</span>' : '')}${r.err ? `<span class="e">${esc(r.err)}</span>` : ''}</div>`;
      if(r.err){ const tip = errTip(r.err); if(tip) html += `<div class="hint"><b>🔎 에러 읽는 법</b><br>${esc(tip)}</div>`; }
      if(grade){
        const ok = r.ok && sameOut(r.out, p.exOut);
        if(ok){ view.passed = true; if(!view.result) view.result = (view.hintsShown||0) > 0 || view.answerShown ? 'hint' : 'solo'; }
        html += ok ? `<div class="verdict ok">🎉 정답! 예시 입력에 대한 출력이 똑같아요. 아래에서 결과를 저장하세요.</div>`
                   : `<div class="verdict no">😅 아직 달라요.${r.ok ? ' 출력 예시와 한 글자씩 비교해 보세요 (띄어쓰기, 줄바꿈 포함).' : ''}</div>`;
      }
      view.runHtml = html; render();
      if(grade) window.malang?.react(r.ok && sameOut(r.out, p.exOut) ? 'correct' : 'wrong');
      else if(!r.ok) window.malang?.react('wrong');
    };
    app.querySelector('[data-run]').onclick = () => runWith(false);
    app.querySelector('[data-grade]').onclick = () => runWith(true);
    const del = app.querySelector('[data-delete]');
    if(del) del.onclick = () => {
      if(!view.delArmed){ keep(); view.delArmed = true; render(); return; }
      db.generated = db.generated.filter(x => x.id !== view.pid);
      delete db.records[view.pid]; delete db.drafts[view.pid];
      save(); refreshProblems(); toast('문제를 삭제했어요'); go('ai');
    };
    code.addEventListener('input', () => { db.drafts[view.pid] = code.value; save(); });
    code.addEventListener('keydown', e => {           // Tab 키로 들여쓰기 4칸
      if(e.key === 'Tab'){ e.preventDefault(); const s = code.selectionStart;
        code.value = code.value.slice(0,s) + '    ' + code.value.slice(code.selectionEnd);
        code.selectionStart = code.selectionEnd = s + 4; code.dispatchEvent(new Event('input')); }
    });
    const hb = app.querySelector('[data-hint]');
    if(hb) hb.onclick = () => { keep(); view.hintsShown = (view.hintsShown||0) + 1; render(); window.malang?.react('hint'); };
    const ab = app.querySelector('[data-answer]');
    if(ab) ab.onclick = () => { keep(); view.answerShown = true; render(); };
    app.querySelectorAll('[data-result]').forEach(el => el.onclick = () => { keep(); view.result = el.dataset.result; render(); });
    app.querySelector('[data-save]').onclick = () => {
      if(!view.result) return;
      const sec = view.startTs ? Math.round(Math.min(Date.now() - view.startTs, 3600e3) / 1000) : 0;   // 문제를 연 뒤 저장까지 (최대 60분)
      saveAttempt(view.pid, view.result, view.hintsShown||0, code.value.trim(), memo.value.trim(), view.passed, sec);
      const r = db.records[view.pid];
      toast(`저장했어요! 다음 복습일은 ${prettyDate(r.next)} 이에요`);
      window.malang?.react('save');
      publishStatus();
      go('detail', { pid:view.pid, hintsShown:0, startTs:Date.now() });
    };
  }

  if(view.name === 'growth'){
    const gd = app.querySelector('#gDaily'), gw = app.querySelector('#gWeek');
    gd.onchange = () => { goals().daily = +gd.value; save(); render(); publishStatus(); };
    gw.onchange = () => { goals().weekDays = +gw.value; save(); render(); publishStatus(); };
    const nx = app.querySelector('[data-next]');
    if(nx) nx.onclick = () => {
      const due = dueList(), fresh = PROBLEMS.find(p => statusOf(p.id) === 'new');
      const target = due[0] || fresh;
      if(target) go('detail', { pid:target.id, hintsShown:0, startTs:Date.now() }); else go('ai');
    };
  }
  if(view.name === 'heal') bindHeal(app);
  if(view.name === 'friends') bindFriends(app);
  if(view.name === 'meet') bindMeet(app);

  if(view.name === 'ai'){
    const v = id => app.querySelector('#'+id);
    const keep = () => { if(v('aiConcept')){ ai.concept = v('aiConcept').value; ai.level = v('aiLevel').value; ai.count = v('aiCount').value; ai.memo = v('aiMemo').value; } };
    ['aiConcept','aiLevel','aiCount','aiMemo'].forEach(id => v(id) && v(id).addEventListener('change', keep));
    const g = app.querySelector('[data-gen]'); if(g) g.onclick = () => { keep(); generate(); };
    const st = app.querySelector('[data-stop]'); if(st) st.onclick = () => ai.ctl && ai.ctl.abort();
  }

  if(view.name === 'backup'){
    app.querySelector('[data-copy]').onclick = async () => {
      const box = app.querySelector('#exportBox');
      try{ await navigator.clipboard.writeText(box.value); toast('복사했어요!'); }
      catch(e){ box.select(); toast('자동 복사가 안 돼요. 선택된 글자를 직접 복사(Ctrl+C)해 주세요'); }
    };
    app.querySelector('[data-import]').onclick = () => {
      try{
        const d = JSON.parse(app.querySelector('#importBox').value);
        if(!d || typeof d.records !== 'object') throw new Error();
        d.drafts ||= {}; d.generated ||= []; db = d; save(); refreshProblems(); toast('불러왔어요!'); go('growth'); publishStatus();
      }catch(e){ toast('백업 코드가 올바르지 않아요'); }
    };
    app.querySelector('[data-reset]').onclick = () => {
      if(!resetArmed){ resetArmed = true; render(); setTimeout(() => { resetArmed = false; if(view.name==='backup') render(); }, 4000); return; }
      resetArmed = false; db = { records:{}, drafts:{}, generated:[] }; save(); refreshProblems(); toast('모든 기록을 지웠어요'); go('home');
    };
  }
}

  try{ if(window.claude && window.claude.use) aiSample = await window.claude.use('sample'); }catch(e){ aiSample = null; }

<script type="module">
/* ===== 3D 마스코트 "말랑이" =====
   three.js로 도형(공·원기둥)을 조합해 직접 만든 오리지널 캐릭터예요.
   누르면 찌그러지는 셰이더 · 스프링 물리 · 효과음은 업로드한 '3D 말랑이' 파일의 방식을 가져왔어요. */
import * as THREE from 'three';

const box = document.getElementById('mascot');
box.hidden = false;                       // 크기를 재기 전에 먼저 보이게
const bubble = document.getElementById('bubble');
const W = () => box.clientWidth, H = () => box.clientHeight;

// ---------- 말풍선 ----------
let bubbleTimer;
let mode = 'corner';
function say(text, ms = 2600){
  const hm = document.getElementById('healMsg');
  if (mode === 'heal' && hm){ hm.textContent = text; return; }
  bubble.textContent = text; bubble.classList.add('show');
  clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
}
const pick = a => a[Math.floor(Math.random() * a.length)];
const TALK = {
  tap:      ['말랑말랑~ 오늘도 한 문제!', '막히면 힌트 1부터 열어 봐!', '코드 짜기 전에 순서를 한국어로 써 봐 ✍️', '에러는 친구야. 몇 번째 줄인지 먼저 봐!', '꾹 누르지 마… 간지러워 >_<', '힌트 없이 풀면 내가 점프할게!'],
  correct:  ['정답이야!! 🎉', '우와 최고! 혼자 해냈어!', '완벽해 ✨ 저장하는 거 잊지 마!'],
  wrong:    ['괜찮아, 거의 다 왔어!', '출력 예시랑 한 글자씩 비교해 봐 👀', '에러 메시지 첫 줄을 읽어 보자!'],
  hint:     ['좋아, 힌트로 배우는 것도 실력이야', '순서대로 하나씩 해 보자!'],
  save:     ['기록 완료! 복습 날에 또 만나 📅', '오늘도 성장했다 🌱'],
  ai:       ['새 문제 도착! 같이 풀자 🍡', '따끈따끈한 문제가 나왔어!'],
  hello:    ['안녕! 난 말랑이야 🍡 눌러 봐!'],
  cheer:    ['친구가 응원을 보냈어! 힘내자 🔥', '응원 도착 💌 우리 같이 힘내자!'],
  rested:   ['잘 쉬었다! 이제 한 문제만 더 풀어 볼까? 💪', '충전 완료 🔋 공부하러 가자!'],
  heal:     ['말랑말랑~ 마음도 말랑해지지?', '뿌쥬욱… 조금 더 눌러도 돼 🍡', '오늘도 수고했어 ♡', '쉬는 것도 공부의 일부야', '꾹— 스트레스 쏙 빠져라!'],
};

// ---------- 3D 기본 세팅 ----------
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
box.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 50);
const TARGET = new THREE.Vector3(0, 0.46, 0), CAM_DIR = new THREE.Vector3(0, 0.06, 1).normalize();
let camDist = 2.7;
function placeCamera(){   // 세로로 긴 화면(폰)에서는 조금 더 뒤로 물러나기
  camera.position.copy(TARGET).addScaledVector(CAM_DIR, camDist * Math.max(1, 1.15 / (camera.aspect || 1))); camera.lookAt(TARGET); }
placeCamera();
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8b8c8, 2.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(2, 4, 3); scene.add(sun);

// 발밑 동글 그림자
const sc = document.createElement('canvas'); sc.width = sc.height = 128;
const g2 = sc.getContext('2d'); const gr = g2.createRadialGradient(64,64,0,64,64,64);
gr.addColorStop(0, 'rgba(120,90,160,0.35)'); gr.addColorStop(1, 'rgba(120,90,160,0)');
g2.fillStyle = gr; g2.fillRect(0,0,128,128);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 1.3), new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(sc), transparent:true, depthWrite:false }));
shadow.rotation.x = -Math.PI/2; shadow.position.y = 0.002; scene.add(shadow);

// ---------- 말랑 셰이더 (업로드 파일의 방식) ----------
const BODY_H = 0.9;
const U = {
  uPoint:{ value:new THREE.Vector3() }, uDir:{ value:new THREE.Vector3() },
  uStrength:{ value:0 }, uRadius:{ value:0.28 }, uSoft:{ value:0.8 },
  uSquash:{ value:0 }, uHeight:{ value:BODY_H },
};
function makeSquishy(mat){
  mat.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, U);
    s.vertexShader = 'uniform vec3 uPoint; uniform vec3 uDir; uniform float uStrength; uniform float uRadius; uniform float uSquash; uniform float uHeight;\n' +
      s.vertexShader.replace('#include <project_vertex>', `
        vec4 sqW = modelMatrix * vec4(transformed, 1.0);
        float sqD = distance(sqW.xyz, uPoint);
        sqW.xyz += uDir * exp(-(sqD*sqD)/(uRadius*uRadius)) * uStrength;
        float sqH = clamp(sqW.y / uHeight, 0.0, 1.0);
        float sqS = clamp(uSquash, -0.6, 0.85);
        float sqWide = 1.0 + (inversesqrt(1.0 - sqS) - 1.0) * (0.5 + 0.9 * sin(3.14159 * sqH));
        sqW.y *= (1.0 - sqS);
        sqW.xz *= sqWide;
        transformed = (inverse(modelMatrix) * sqW).xyz;
        #include <project_vertex>`);
    if (s.fragmentShader.includes('vViewPosition')) {
      s.fragmentShader = 'uniform float uSoft;\n' + s.fragmentShader.replace('#include <dithering_fragment>', `
        float sqRim = 1.0 - abs(dot(normalize(normal), normalize(vViewPosition)));
        gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.0,0.95,0.97), 0.12*uSoft) + vec3(1.0,0.94,0.98) * pow(sqRim, 2.0) * 0.55 * uSoft;
        #include <dithering_fragment>`);
    }
  };
  return mat;
}
const mat = (color, rough = 0.9) => makeSquishy(new THREE.MeshStandardMaterial({ color, roughness:rough, metalness:0 }));
const glossy = (color) => makeSquishy(new THREE.MeshStandardMaterial({ color, roughness:0.25, metalness:0 }));

// ---------- 말랑이 만들기: 민트색 찹쌀떡 + 새싹 ----------
const root = new THREE.Group();   // 발밑이 원점
scene.add(root);
const add = (geo, m, x, y, z, sx = 1, sy = 1, sz = 1) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.scale.set(sx, sy, sz); root.add(o); return o; };

// 몸통 (살짝 납작한 공)
const body = add(new THREE.SphereGeometry(0.5, 64, 48), mat(0xbff2dc), 0, 0.425, 0, 1.12, 0.85, 1);
// 볼터치
const cheekM = mat(0xffb3cf);
add(new THREE.SphereGeometry(0.07, 24, 16), cheekM, -0.3, 0.4, 0.405, 1, 0.6, 0.35);
add(new THREE.SphereGeometry(0.07, 24, 16), cheekM,  0.3, 0.4, 0.405, 1, 0.6, 0.35);
// 눈 + 반짝이
const eyeM = glossy(0x3b2f4a), whiteM = mat(0xffffff, 0.4);
const eyes = [
  add(new THREE.SphereGeometry(0.055, 24, 16), eyeM, -0.17, 0.5, 0.455, 1, 1.15, 0.6),
  add(new THREE.SphereGeometry(0.055, 24, 16), eyeM,  0.17, 0.5, 0.455, 1, 1.15, 0.6),
];
add(new THREE.SphereGeometry(0.018, 12, 8), whiteM, -0.15, 0.525, 0.49);
add(new THREE.SphereGeometry(0.018, 12, 8), whiteM,  0.19, 0.525, 0.49);
// 입 (웃는 반달)
const mouth = add(new THREE.TorusGeometry(0.045, 0.013, 10, 24, Math.PI), mat(0x3b2f4a), 0, 0.445, 0.488);
mouth.rotation.z = Math.PI;
// 머리 위 새싹
const leafM = mat(0x7fd49b);
add(new THREE.CylinderGeometry(0.014, 0.018, 0.12, 10), leafM, 0, 0.83, 0);
const leafL = add(new THREE.SphereGeometry(0.08, 20, 12), leafM, -0.075, 0.9, 0, 1, 0.42, 0.62); leafL.rotation.z =  0.5;
const leafR = add(new THREE.SphereGeometry(0.08, 20, 12), leafM,  0.075, 0.9, 0, 1, 0.42, 0.62); leafR.rotation.z = -0.5;
root.traverse(o => { if (o.isMesh) o.frustumCulled = false; });

// ---------- 효과음 (업로드 파일처럼 직접 합성) ----------
let actx = null;
function audio(){ if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume(); return actx; }
function playSquish(){
  if (!soundOn) return;
  try{
    const ctx = audio(), t = ctx.currentTime, vol = 0.18;
    const o = ctx.createOscillator(); o.type = 'sine';
    const f = 210 + Math.random() * 30;
    o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.45, t + 0.3);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.35);
  }catch(e){}
}
function playBoing(high = 1){
  if (!soundOn) return;
  try{
    const ctx = audio(), t = ctx.currentTime, vol = 0.16;
    const o = ctx.createOscillator(); o.type = 'sine';
    const f = (330 + Math.random() * 90) * high;
    o.frequency.setValueAtTime(f * 0.7, t); o.frequency.exponentialRampToValueAtTime(f * 1.9, t + 0.07); o.frequency.exponentialRampToValueAtTime(f * 1.2, t + 0.4);
    const lfo = ctx.createOscillator(); lfo.frequency.value = 14;
    const lg = ctx.createGain(); lg.gain.value = f * 0.12; lfo.connect(lg).connect(o.frequency);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g).connect(ctx.destination); o.start(t); lfo.start(t); o.stop(t + 0.5); lfo.stop(t + 0.5);
  }catch(e){}
}

// ---------- 누르기 ----------
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let pressing = false, hitHeight = 1, held = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObject(root, true)[0];
  if (!hit){ if (mode === 'heal'){ rotating = true; lastX = e.clientX; } return; }
  U.uPoint.value.copy(hit.point); U.uDir.value.copy(ray.ray.direction);
  hitHeight = THREE.MathUtils.clamp(hit.point.y / BODY_H, 0, 1);
  pressing = true; held = performance.now();
  playSquish();
});
let rotating = false, lastX = 0, userYaw = 0;
addEventListener('pointermove', (e) => { if (rotating){ userYaw += (e.clientX - lastX) * 0.012; lastX = e.clientX; } });
addEventListener('pointerup', () => {
  rotating = false;
  if (!pressing) return;
  pressing = false; playBoing();
  window.malang?.onSquish?.();
  if (mode === 'heal'){ if (Math.random() < 0.35) say(pick(TALK.heal)); }
  else if (performance.now() - held < 600) say(pick(TALK.tap));
});

// ---------- 스프링 물리 + 감정 표현 ----------
let press = 0, pressVel = 0, squash = 0, squashVel = 0;
let jumpY = 0, jumpV = 0, shake = 0, tilt = 0, nextBlink = 2, blink = 0;
let DENT = 0.16, SQUASH = 0.45, soundOn = true;
const STIFF = 110, DAMP = 5.5;
const clock = new THREE.Clock();
let visible = true;
document.addEventListener('visibilitychange', () => { visible = !document.hidden; });

renderer.setAnimationLoop(() => {
  if (!visible) return;
  const dt = Math.min(clock.getDelta(), 0.033), t = clock.elapsedTime;
  pressVel += (((pressing ? DENT : 0) - press) * STIFF - pressVel * DAMP) * dt; press += pressVel * dt;
  U.uStrength.value = press;
  const breathe = Math.sin(t * 2.2) * 0.025;                          // 숨쉬기
  squashVel += (((pressing ? SQUASH * (0.3 + 0.7 * hitHeight) : breathe) - squash) * STIFF * 0.7 - squashVel * DAMP * 0.8) * dt;
  squash += squashVel * dt; U.uSquash.value = squash;
  // 점프 (정답일 때)
  jumpV -= 9.8 * dt; jumpY += jumpV * dt;
  if (jumpY < 0){ if (jumpV < -1.2){ squashVel += -jumpV * 1.6; playBoing(0.8); } jumpY = 0; jumpV = 0; }
  root.position.y = jumpY;
  // 고개 젓기 (틀렸을 때) / 갸웃 (힌트)
  shake *= 0.92; tilt *= 0.95;
  if (!rotating) userYaw *= 0.97;                                   // 손을 떼면 천천히 정면으로
  root.rotation.y = userYaw + Math.sin(t * 18) * shake + Math.sin(t * 0.8) * 0.18;
  root.rotation.z = tilt;
  // 눈 깜빡
  nextBlink -= dt; if (nextBlink < 0){ blink = 0.12; nextBlink = 2 + Math.random() * 3; }
  blink = Math.max(0, blink - dt);
  const ey = blink > 0 ? 0.15 : 1.15; eyes.forEach(e => e.scale.y += (ey - e.scale.y) * 0.5);
  shadow.scale.setScalar((1 + Math.max(squash, 0) * 2) * (1 - Math.min(jumpY, 0.5)));
  renderer.render(scene, camera);
});

function fit(){ const w = W(), h = H(); if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); placeCamera(); }
new ResizeObserver(fit).observe(box); fit();

// ---------- 앱이 부르는 함수 ----------
window.malang = {
  react(type){
    if (type === 'correct' || type === 'ai' || type === 'save' || type === 'cheer'){ if (jumpY === 0) jumpV = type === 'correct' ? 3.2 : 2.4; }
    if (type === 'wrong') shake = 0.35;
    if (type === 'hint') tilt = 0.25;
    if (type === 'rested'){ if (jumpY === 0) jumpV = 2.6; }
    if (TALK[type]) say(pick(TALK[type]));
  },
  say,
  setMode(m){
    if (m === mode) return;
    mode = m;
    if (m === 'corner'){ camDist = 2.7; placeCamera(); U.uRadius.value = 0.28; U.uSoft.value = 0.8; DENT = 0.16; SQUASH = 0.45; userYaw = 0; }
    fit();
  },
  setParams(p){                                    // 힐링 탭 슬라이더 (업로드 파일과 같은 방식)
    const f = p.force / 100;
    DENT = 0.3 * f; SQUASH = 0.6 * f;
    U.uRadius.value = p.size / 100;
    U.uSoft.value = p.soft / 100;
    camDist = 4.6 - 3.0 * (p.zoom / 100); placeCamera();
    soundOn = p.sound;
  },
  onSquish: null,
};
// 지금 화면이 힐링 탭이면 바로 맞추기
if (box.classList.contains('big')){ window.malang.setMode('heal'); }
window.malang.onSquish = () => window.dispatchEvent(new Event('mascot-squish'));
setTimeout(() => { if (mode === 'corner') window.malang.react('hello'); }, 900);
</script>
